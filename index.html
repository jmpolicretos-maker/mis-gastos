<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f7a5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gastos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Mis Gastos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@600&display=swap">
<style>
:root{--bg:#f5f6f4;--card:#fff;--fg:#1d2420;--mut:#66706a;--line:#e1e5e1;--acc:#1f7a5c;--bad:#c2410c;--ok:#1f7a5c;--onacc:#fff;
--k1:#1f7a5c;--k2:#7c8794;--k3:#2563eb;--neg:#d97706;--comp:#be185d;--per:#6b7280;
--sans:'Inter',system-ui,sans-serif;--head:'Space Grotesk','Inter',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#121715;--card:#1b221f;--fg:#e8ede9;--mut:#93a09a;--line:#2b3430;--acc:#4cc59b;--bad:#fb923c;--ok:#4cc59b;--onacc:#0b1410;--k1:#4cc59b;--k2:#aab4bf;--k3:#60a5fa;--neg:#fbbf24;--comp:#f472b6;--per:#9ca3af;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--sans);padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--head);margin:0;text-wrap:balance}
h1{font-size:26px}h2{font-size:19px}h3{font-size:17px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.month{display:flex;align-items:center;gap:8px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 14px;min-height:42px}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:600}
input,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:42px;font-size:16px}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--acc)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:600}
.total{font:600 34px var(--head);font-variant-numeric:tabular-nums}
.mut{color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums;font-weight:600;font-size:16px}
.kcard{border-left:4px solid var(--c)}
.kcard .total{font-size:28px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);min-width:0}
form .full{grid-column:1/-1}
.item{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item.s2{grid-template-columns:1fr auto auto}
.item:first-child{border-top:0}
.item .n{min-width:0;overflow-wrap:break-word;font-size:17px;font-weight:600;line-height:1.35}
.item .n .mut{font-size:14px;font-weight:400;margin-top:2px}
.item .num{font-size:18px;white-space:nowrap}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--c,var(--line));color:var(--c,var(--mut))}
.x{border:0;background:none;color:var(--mut);padding:4px 10px}
.empty{color:var(--mut);padding:8px 0}
.ok{color:var(--ok);font-weight:600}.warn{color:var(--bad);font-weight:600}
.split{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--line);margin-top:8px}
.split i{display:block;height:100%}
.msg{padding:10px 12px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
.msg.err{border-color:var(--bad);color:var(--bad)}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tri div{display:flex;flex-direction:column;gap:2px;min-width:0}
.tri b{font-size:18px;overflow-wrap:anywhere}
.modes{display:flex;gap:8px}
.modes button{flex:1;font-weight:600}
.modes button[aria-selected=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.danger{color:var(--bad);border-color:var(--bad)}
.big{font:600 24px var(--head)}
.login{max-width:380px;margin:8vh auto 0}
[hidden]{display:none!important}
@media (max-width:480px){
.total{font-size:30px}
.item{grid-template-columns:auto 1fr auto;column-gap:10px;row-gap:2px}
.item>:nth-child(1){grid-row:1/3;grid-column:1;align-self:center}
.item>.n{grid-column:2;grid-row:1;overflow-wrap:break-word}
.item>.num{grid-column:2;grid-row:2;justify-self:start}
.item>:nth-child(4){grid-column:3;grid-row:1/3;align-self:center}
.item.s2{grid-template-columns:1fr auto}
.item.s2>.n{grid-column:1;grid-row:1}
.item.s2>.num{grid-column:1;grid-row:2;justify-self:start}
.item.s2>:nth-child(3){grid-column:2;grid-row:1/3;align-self:center}
}
</style>
</head>

const TARJ=[["AMEX Verde","--k1"],["AMEX Platinum","--k2"],["BBVA Platinum","--k3"]];

const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fd=s=>{if(!s)return"";const[y,m,d]=s.split("-");return (+d)+" "+MES[+m-1]+" "+y};
const tcol=t=>(TARJ.find(x=>x[0]===t)||["","--per"])[1];
const topt=(arr,sel)=>arr.map(x=>`<option value="${esc(x[0])}"${x[0]===sel?" selected":""}>${esc(x[1])}</option>`).join("");
const clampPct=v=>Math.min(100,Math.max(0,isNaN(parseFloat(v))?50:parseFloat(v)));
const diasMes=(y,m0)=>new Date(y,m0+1,0).getDate();
let rol=null,tab="",fTarj="",cur=new Date(),D={gastos:[],fijos:[],pagos:[],hip:{},invit:[],sm:{ing:[],compras:[],gastos:[],rec:[],items:[],prod:[],precios:[],ventas:[]}},modo="fin",rdet=null,edit=null,armed=false,me=null,FECHA_OK=false,FORMA_OK=false,sfecha="",sforma="Efectivo",sobs="";
cur.setDate(1);
const ym=()=>cur.getFullYear()+"-"+pad(cur.getMonth()+1);
const ymNow=()=>{const t=new Date();return t.getFullYear()+"-"+pad(t.getMonth()+1)};
const owner=()=>rol==="owner";
const pctDueno=g=>g.pct==null?50:Number(g.pct);
const miParte=g=>g.tipo==="compartido"?g.monto*pctDueno(g)/100:g.monto;
const sum=a=>a.reduce((s,g)=>s+Number(g.monto),0);
const say=(m,err)=>{const n=$("note");if(n){n.textContent=m;n.className="msg"+(err?" err":"");n.hidden=!m}};
const dbErr=e=>{const m=(e&&e.message)||"";let t;
  if(e&&e.code==="23505")t=m.includes("sm_ingredientes")?"Ya existe una materia prima con ese nombre.":m.includes("sm_recetas")?"Ya existe una receta con ese nombre.":"Ese mes ya tiene un pago registrado. Edítalo desde la lista.";
  else if(e&&e.code==="23503")t="No se puede eliminar: se usa en otro registro, por ejemplo en una receta.";
  else t="No se pudo completar: "+(m||"error de conexión");
  say(t,true)};

/* ---------- fijos: se suman solos cada mes ---------- */
function fijosVirtuales(){
  const k=ym();
  return D.fijos.filter(f=>(f.creado||"").slice(0,7)<=k&&!D.gastos.some(g=>g.fijoId===f.id&&g.fecha&&g.fecha.startsWith(k)))
    .map(f=>({id:"fx-"+f.id,virtual:true,fijoId:f.id,monto:f.monto,tarjeta:f.tarjeta,tipo:f.tipo,pct:f.tipo==="compartido"?50:null,nota:f.nombre,cotejado:false,por:"owner",
      fecha:k+"-"+pad(Math.min(f.dia,diasMes(cur.getFullYear(),cur.getMonth())))}));
}
const mesG=()=>[...D.gastos.filter(g=>g.fecha&&g.fecha.startsWith(ym())),...fijosVirtuales()];
function proxCobro(dia){
  const t=new Date();let y=t.getFullYear(),m=t.getMonth(),dd=Math.min(dia,diasMes(y,m));
  if(dd<t.getDate()){m++;if(m>11){m=0;y++}dd=Math.min(dia,diasMes(y,m))}
  return y+"-"+pad(m+1)+"-"+pad(dd);
}
function payerOf(g){return g.quien==="Yo"||g.quien==="Sofi"?g.quien:(g.quien?"Otro":(g.por==="esposa"?"Sofi":"Yo"))}
function ledger(){
  const L=D.gastos.filter(g=>g.tipo==="compartido"),ab=L.filter(g=>!g.saldada),sa=L.filter(g=>g.saldada);
  let sofiDebe=0,duenoDebe=0,pagoYo=0,pagoSofi=0;
  ab.forEach(g=>{const w=payerOf(g),own=g.monto*pctDueno(g)/100,sof=g.monto-own;
    if(w==="Yo"){pagoYo+=g.monto;sofiDebe+=sof}else if(w==="Sofi"){pagoSofi+=g.monto;duenoDebe+=own}});
  const r=n=>Math.round(n*100)/100;
  return{ab,sa,sofiDebe:r(sofiDebe),duenoDebe:r(duenoDebe),pagoYo,pagoSofi,neto:r(sofiDebe-duenoDebe)};
}
const sdate=()=>FECHA_OK?{saldada_fecha:ymd(new Date())}:{};
const sd=g=>g.saldada?(g.saldada_fecha?" (saldado el "+fd(g.saldada_fecha)+(g.saldada_forma?" · "+g.saldada_forma:"")+")":" (saldado)"):"";
const pagados=()=>D.pagos.filter(p=>p.registrado_por!=="pendiente");
function hipPlan(){
  const hoy=ymd(new Date());
  const pl=D.pagos.filter(p=>p.registrado_por==="pendiente").sort((a,b)=>a.fecha.localeCompare(b.fecha));
  if(!pl.length)return null;
  const p=pl[0],dias=Math.round((new Date(p.fecha+"T00:00:00")-new Date(hoy+"T00:00:00"))/864e5);
  return{...p,dias,vencida:dias<0};
}

/* ---------- sesión ---------- */
async function boot(){
  if(RECOVERY&&!recDone)return pantallaNuevaClave();
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return pantallaLogin();
  const {data,error}=await sb.rpc("fin_reclamar");
  if(error){return pantallaLogin("No se pudo verificar tu acceso: "+error.message)}
  if(!data)return pantallaSinAcceso(session.user.email);
  rol=data;try{modo=localStorage.getItem("modo")==="sm"?"sm":"fin"}catch(e){}
  tab=modo==="sm"?"s_resumen":(owner()?"resumen":"compartidos");edit=null;rdet=null;
  FECHA_OK=!(await sb.from("fin_gastos").select("saldada_fecha").limit(1)).error;
  FORMA_OK=!(await sb.from("fin_gastos").select("saldada_forma,saldada_obs").limit(1)).error;
  await cargar();shell();
}
function pantallaLogin(m){
  $("app").innerHTML=`<div class="login card"><h1 style="margin-bottom:4px">Mis Gastos</h1><div class="mut" style="margin-bottom:14px">Entra con tu correo y contraseña.</div>
  <form id="fl"><label class="full">Correo<input id="l-mail" type="email" autocomplete="email" required></label>
  <label class="full">Contraseña<input id="l-pass" type="password" autocomplete="current-password" minlength="6" required></label>
  <button class="pri full" type="submit" id="l-in">Entrar</button>
  <button class="full" type="button" id="l-up">Crear cuenta</button>
  <button class="full" type="button" id="l-forgot" style="border:0;background:none;color:var(--acc)">Olvidé mi contraseña</button></form>
  <div id="note" class="msg ${m?"err":""}" style="margin-top:12px" ${m?"":"hidden"}>${esc(m||"")}</div>
  <div class="mut" style="margin-top:12px">Si te invitaron: usa el mismo correo con el que te invitaron y toca "Crear cuenta".</div></div>`;
  $("fl").onsubmit=async e=>{e.preventDefault();$("l-in").disabled=true;
    const {error}=await sb.auth.signInWithPassword({email:$("l-mail").value.trim(),password:$("l-pass").value});
    if(error){$("l-in").disabled=false;say(error.message==="Invalid login credentials"?"Correo o contraseña incorrectos.":error.message,true)}else boot()};
  $("l-forgot").onclick=async()=>{const email=$("l-mail").value.trim();
    if(!email)return say("Escribe tu correo arriba y vuelve a tocar \"Olvidé mi contraseña\".",true);
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
    if(error)return say(error.message,true);
    say("Si ese correo tiene cuenta, te enviamos un enlace para crear una contraseña nueva. Revisa tu bandeja y el spam.")};
  $("l-up").onclick=async()=>{const email=$("l-mail").value.trim(),password=$("l-pass").value;
    if(!email||password.length<6)return say("Escribe tu correo y una contraseña de al menos 6 caracteres.",true);
    const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});
    if(error)return say(error.message,true);
    if(data.session)boot();else say("Cuenta creada. Revisa tu correo para confirmarla y luego entra.")};
}
function pantallaNuevaClave(){
  $("app").innerHTML=`<div class="login card"><h1 style="margin-bottom:4px">Contraseña nueva</h1><div class="mut" style="margin-bottom:14px">Escribe la contraseña nueva y guárdala en un lugar seguro.</div>
  <form id="fr"><label class="full">Contraseña nueva<input id="r-p1" type="password" autocomplete="new-password" minlength="6" required></label>

  $("app").innerHTML=`<div class="login card"><h2>Tu cuenta aún no tiene acceso</h2>
  <p class="mut">Entraste como <b>${esc(mail)}</b>. Pide al dueño de la app que agregue este correo en la pestaña Acceso y vuelve a entrar.</p>
  <button id="out" class="full">Salir</button></div>`;

/* ---------- datos ---------- */
async function cargar(){
  const q=[sb.from("fin_gastos").select("*").order("fecha",{ascending:false}).order("creado",{ascending:false}),
           sb.from("fin_hipoteca_pagos").select("*"),sb.from("fin_hipoteca_config").select("*").eq("id",1).maybeSingle()];
  if(owner()){q.push(sb.from("fin_fijos").select("*").order("creado"),sb.from("fin_invitados").select("*"))}
  const r=await Promise.all(q);
  const bad=r.find(x=>x.error);if(bad)return dbErr(bad.error);
  D.gastos=(r[0].data||[]).map(g=>({...g,monto:Number(g.monto),fijoId:g.fijo_id}));
  D.pagos=(r[1].data||[]).map(p=>({...p,monto:Number(p.monto)}));
  D.hip=r[2].data||{};
  if(owner()){D.fijos=(r[3].data||[]).map(f=>({...f,monto:Number(f.monto)}));D.invit=r[4].data||[]}
  await cargarSM();
}
async function run(p){const {error}=await p;if(error){dbErr(error);return false}say("");await cargar();render();return true}

/* ---------- vistas ---------- */
const fila=g=>`<div class="item s2"><div class="n">${esc(g.nota||"Sin concepto")}<div class="mut">${esc(g.tarjeta)} · pagó ${esc(g.quien||"Yo")} · se le debe a <b>${esc(g.deuda)}</b> · ${fd(g.fecha)}</div></div><span class="num">${fmt(g.monto)}</span><button data-saldar="${esc(g.id)}">Saldar</button></div>`;

function vResumen(){
  const hoy=ymd(new Date()),k=ymNow();
  const efe=D.gastos.filter(g=>g.tarjeta==="Efectivo");
  const hoyL=efe.filter(g=>g.fecha===hoy),mesE=efe.filter(g=>g.fecha&&g.fecha.startsWith(k));
  const deudas=D.gastos.filter(g=>g.deuda&&!g.saldada);
  const hp=hipPlan(),hipPend=hp&&(hp.vencida||hp.dias<=5);
  const led=ledger(),nCta=Math.abs(led.neto)>=0.01?1:0;
  const nPend=deudas.length+(hipPend?1:0)+nCta;
  const fecha=new Date().toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"});
  const mesAll=mesG().filter(g=>TARJ.some(x=>x[0]===g.tarjeta));
  const corte=TARJ.map(([t,c])=>{
    const L=mesAll.filter(g=>g.tarjeta===t),tot=sum(L);
    const neg=sum(L.filter(g=>g.tipo==="negocio")),compL=L.filter(g=>g.tipo==="compartido");
    const compMio=compL.reduce((s,g)=>s+miParte(g),0),compSofi=sum(compL)-compMio;
    const mio=tot-neg-sum(compL)+compMio;
    return `<div class="card kcard" style="--c:var(${c})"><div class="row"><h3>${t}</h3><span class="num">${fmt(tot)}</span></div>
     <div class="tri"><div><span class="mut">Mío</span><b class="num">${fmt(mio)}</b></div><div><span class="mut">Sofi</span><b class="num">${fmt(compSofi)}</b></div><div><span class="mut">Negocio</span><b class="num">${fmt(neg)}</b></div></div></div>`}).join("");
  const hipFila=hipPend?`<div class="item s2"><div class="n">Hipoteca<div class="mut ${hp.vencida?"warn":""}">${hp.vencida?"Vencida el ":"Vence el "}${fd(hp.fecha)}</div></div><span class="num">${fmt(hp.monto)}</span><button data-pay="${esc(hp.id)}">Registrar pago</button></div>`:"";
  return `<div class="card"><div class="mut">${fecha.charAt(0).toUpperCase()+fecha.slice(1)}</div>
   <div class="mut" style="margin-top:6px">Efectivo gastado hoy</div><div class="total">${fmt(sum(hoyL))}</div>
   <div class="mut">${hoyL.length} ${hoyL.length===1?"gasto":"gastos"} hoy · este mes en efectivo: <b>${fmt(sum(mesE))}</b></div></div>

function vCompartidos(){

    if(w==="Otro")deb="Pagó otra persona";
    else if(o)deb=w==="Yo"?`Sofi te debe ${fmt(sof)}`:`Le debes ${fmt(own)} a Sofi`;
    else deb=w==="Yo"?`Le debes ${fmt(sof)} a tu pareja`:`Tu pareja te debe ${fmt(own)}`;
    const quien=o?(w==="Yo"?"Pagaste tú":w==="Sofi"?"Pagó Sofi":"Pagó otra persona"):(w==="Sofi"?"Pagaste tú":w==="Yo"?"Pagó tu pareja":"Pagó otra persona");

    ${FECHA_OK||FORMA_OK?`<form onsubmit="return false" style="margin-bottom:12px">${FECHA_OK?`<label>Fecha en que se saldó<input id="s-fecha" type="date" value="${esc(sfecha||ymd(new Date()))}"></label>`:""}${FORMA_OK?`<label>Forma de pago<select id="s-forma">${topt([["","—"],["Efectivo","Efectivo"],["Transferencia","Transferencia"],["Otro","Otro"]].slice(1),sforma)}</select></label><label class="full">Observaciones<input id="s-obs" maxlength="120" value="${esc(sobs)}" placeholder="Ej. transferencia SPEI, referencia 123"></label>`:""}</form>`:""}
    ${armed?`<div class="msg err" style="margin-bottom:10px">Se marcarán ${led.ab.length} gastos como saldados. Toca "Sí, saldar cuenta" para confirmar.</div>`:""}
    <div class="actions"><button class="pri" data-act="saldarcuenta" ${led.ab.length?"":"disabled"}>${armed?"Sí, saldar cuenta":"Saldar cuenta"}</button>${armed?'<button data-act="canc2">Cancelar</button>':""}</div></section>`
    :`<div class="mut">Cuando se pague la diferencia, tu pareja salda la cuenta y todo queda en cero.</div>`;
  return `<section class="card"><div class="mut">Cuenta compartida</div><div class="big" style="margin-top:2px">${titulo}</div>${monto?`<div class="total">${monto}</div>`:""}<div class="mut" style="margin-top:6px">${sub||"No hay gastos compartidos pendientes."}</div></section>

/* ======================= SALSA MACHA ======================= */
const FAC={kg:1000,g:1,l:1000,ml:1,pza:1,diente:1},FAM={kg:"m",g:"m",l:"v",ml:"v",pza:"p",diente:"d"};
const ul=u=>u==="diente"?"dientes":(u||"");
const unidadesDe=u=>Object.keys(FAM).filter(k=>FAM[k]===FAM[u]);
const qtyIn=(c,from,ing)=>FAM[from]===FAM[ing.unidad]?c*FAC[from]/FAC[ing.unidad]:c;
const CATEG=["Envases y frascos","Etiquetas y empaque","Marketing","Equipo y utensilios","Transporte","Servicios","Otro"];
const CAT_OPTS=CATEG.map(c=>[c,c]),FORMA_OPTS=[["","—"],["Efectivo","Efectivo"],["Transferencia","Transferencia"],["Tarjeta","Tarjeta"],["Otro","Otro"]];
const UNI_OPTS=Object.keys(FAM).map(u=>[u,u]);
const fmt4=n=>"$"+Number(n||0).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:4});
const fq=n=>Number(n||0).toLocaleString("es-MX",{maximumFractionDigits:3});
const ingBy=id=>D.sm.ing.find(i=>i.id===id);
const recBy=id=>D.sm.rec.find(r=>r.id===id);
const pagoOpts=()=>owner()?[["owner","Yo"],["esposa","Sofi"]]:[["esposa","Yo"],["owner","Mi pareja"]];
const miPago=()=>owner()?"owner":"esposa";
const quienL=p=>owner()?(p==="owner"?"Pagué yo":"Pagó Sofi"):(p==="esposa"?"Pagué yo":"Pagó mi pareja");
const chk=async p=>{const {error}=await p;if(error)throw error};
async function seq(fn){try{await fn();say("");await cargar();render();return true}catch(e){dbErr(e);return false}}
const hoyS=()=>ymd(new Date());
const byFecha=(a,b)=>b.fecha.localeCompare(a.fecha)||String(b.creado||"").localeCompare(String(a.creado||""));

function costoLote(r){return D.sm.items.filter(x=>x.receta_id===r.id).reduce((s,it)=>{const i=ingBy(it.ingrediente_id);return s+(i?qtyIn(it.cantidad,it.unidad,i)*i.precio:0)},0)}
const costoFrasco=r=>costoLote(r)/(r.rendimiento||1);
function consumo(r,lotes){const o={};D.sm.items.filter(x=>x.receta_id===r.id).forEach(it=>{const i=ingBy(it.ingrediente_id);if(i)o[i.id]=(o[i.id]||0)+qtyIn(it.cantidad,it.unidad,i)*lotes});return o}

async function cargarSM(){
  const T=["sm_ingredientes","sm_compras","sm_gastos","sm_recetas","sm_receta_items","sm_producciones","sm_precios","sm_ventas"];
  const r=await Promise.all(T.map(t=>sb.from(t).select("*")));
  const bad=r.find(x=>x.error);if(bad)return dbErr(bad.error);
  const N=(a,ks)=>(a||[]).map(o=>{const c={...o};ks.forEach(k=>{if(c[k]!=null)c[k]=Number(c[k])});return c});
  const byName=(a,b)=>a.nombre.localeCompare(b.nombre,"es");
  D.sm.ing=N(r[0].data,["precio","existencia","minimo"]).sort(byName);
  D.sm.compras=N(r[1].data,["total","cantidad"]);
  D.sm.gastos=N(r[2].data,["monto"]);
  D.sm.rec=N(r[3].data,["rendimiento","precio_venta","existencia"]).sort(byName);
  D.sm.items=N(r[4].data,["cantidad"]);
  D.sm.prod=N(r[5].data,["lotes","frascos","costo"]);
  D.sm.precios=N(r[6].data,["precio"]);
  D.sm.ventas=N(r[7].data,["cantidad","precio","total"]);
}

/* --- operaciones que mantienen el inventario al dia --- */
async function addCompra(c){
  await chk(sb.from("sm_compras").insert(c));
  if(c.ingrediente_id){
    const ing=ingBy(c.ingrediente_id),q=qtyIn(c.cantidad,c.unidad,ing),precio=q>0?c.total/q:ing.precio;
    await chk(sb.from("sm_ingredientes").update({existencia:ing.existencia+q,precio,proveedor:c.proveedor||ing.proveedor}).eq("id",ing.id));
    await chk(sb.from("sm_precios").insert({ingrediente_id:ing.id,fecha:c.fecha,precio,proveedor:c.proveedor||null,origen:"compra"}));
  }
}
async function editCompra(old,patch){
  await chk(sb.from("sm_compras").update(patch).eq("id",old.id));
  const dl={};
  if(old.ingrediente_id){const i=ingBy(old.ingrediente_id);if(i)dl[i.id]=(dl[i.id]||0)-qtyIn(old.cantidad,old.unidad,i)}
  if(patch.ingrediente_id){const i=ingBy(patch.ingrediente_id);if(i)dl[i.id]=(dl[i.id]||0)+qtyIn(patch.cantidad,patch.unidad,i)}
  for(const id in dl){if(Math.abs(dl[id])>1e-9)await chk(sb.from("sm_ingredientes").update({existencia:ingBy(id).existencia+dl[id]}).eq("id",id))}
}
async function addProd(r,lotes,frascos,fecha,nota){
  await chk(sb.from("sm_producciones").insert({fecha,receta_id:r.id,lotes,frascos,nota,costo:Math.round(costoLote(r)*lotes*100)/100}));
  const dl=consumo(r,lotes);
  for(const id in dl)await chk(sb.from("sm_ingredientes").update({existencia:ingBy(id).existencia-dl[id]}).eq("id",id));
  await chk(sb.from("sm_recetas").update({existencia:r.existencia+frascos}).eq("id",r.id));
}
async function addVenta(v){
  await chk(sb.from("sm_ventas").insert(v));
  if(v.receta_id){const r=recBy(v.receta_id);if(r)await chk(sb.from("sm_recetas").update({existencia:r.existencia-v.cantidad}).eq("id",r.id))}
}
async function editVenta(old,patch){
  await chk(sb.from("sm_ventas").update(patch).eq("id",old.id));
  const dl={};
  if(old.receta_id)dl[old.receta_id]=(dl[old.receta_id]||0)+(old.cantidad||0);
  if(patch.receta_id)dl[patch.receta_id]=(dl[patch.receta_id]||0)-(patch.cantidad||0);
  for(const id in dl){const r=recBy(id);if(r&&Math.abs(dl[id])>1e-9)await chk(sb.from("sm_recetas").update({existencia:r.existencia+dl[id]}).eq("id",id))}
}
async function smDelete(k,id){
  if(k==="sm_compras"){
    const c=D.sm.compras.find(x=>x.id===id);
    await chk(sb.from("sm_compras").delete().eq("id",id));
    if(c&&c.ingrediente_id){const i=ingBy(c.ingrediente_id);if(i)await chk(sb.from("sm_ingredientes").update({existencia:i.existencia-qtyIn(c.cantidad,c.unidad,i)}).eq("id",i.id))}
  }else if(k==="sm_prod"){
    const p=D.sm.prod.find(x=>x.id===id),r=p&&recBy(p.receta_id);
    await chk(sb.from("sm_producciones").delete().eq("id",id));
    if(r){const dl=consumo(r,p.lotes);for(const iid in dl)await chk(sb.from("sm_ingredientes").update({existencia:ingBy(iid).existencia+dl[iid]}).eq("id",iid));
      await chk(sb.from("sm_recetas").update({existencia:r.existencia-p.frascos}).eq("id",r.id))}
  }else if(k==="sm_ventas"){
    const v=D.sm.ventas.find(x=>x.id===id);
    await chk(sb.from("sm_ventas").delete().eq("id",id));
    if(v&&v.receta_id){const r=recBy(v.receta_id);if(r)await chk(sb.from("sm_recetas").update({existencia:r.existencia+(v.cantidad||0)}).eq("id",r.id))}
  }else await chk(sb.from(TABLA[k]).delete().eq("id",id));
}

function vSPrecios(){

function smEditSubmit(k,id){
  const g=x=>$(x)?$(x).value:"",n=x=>parseFloat(g(x)),t=x=>g(x).trim()||null;
  let fn;
  if(k==="sm_gastos"||k==="sm_compras"){
    const sal=$("e-saldado").checked;
    const base={fecha:g("e-date"),pago:g("e-pago"),forma:t("e-forma"),nota:t("e-note"),saldado:sal,saldado_fecha:sal?(g("e-sfecha")||hoyS()):null,saldado_forma:sal?t("e-sforma"):null,saldado_obs:sal?t("e-sobs"):null};
    if(k==="sm_gastos"){
      const monto=n("e-amt"),concepto=g("e-concepto").trim();if(!(monto>0)||!concepto)return;
      const patch={...base,monto,concepto,categoria:g("e-cat")};
      fn=()=>chk(sb.from("sm_gastos").update(patch).eq("id",id));
    }else{
      const old=D.sm.compras.find(x=>x.id===id),total=n("e-amt");if(!old||!(total>0))return;
      const ingId=g("e-ing")||null,ing=ingId?ingBy(ingId):null,cant=g("e-cant")===""?null:n("e-cant");
      const concepto=ing?ing.nombre:g("e-concepto").trim();
      if(!concepto){say("Escribe qué compraste.",true);return}
      if(ing&&!(cant>0)){say("Escribe la cantidad comprada.",true);return}
      const patch={...base,total,ingrediente_id:ingId,concepto,cantidad:cant,unidad:(ing||cant)?g("e-uni"):null,proveedor:t("e-prov")};
      fn=()=>editCompra(old,patch);
    }
  }else if(k==="sm_ventas"){
    const old=D.sm.ventas.find(x=>x.id===id),total=n("e-amt");if(!old||!(total>0))return;
    const rid=g("e-prod")||null,r=rid?recBy(rid):null,cant=g("e-cant")===""?null:n("e-cant");
    const concepto=r?r.nombre:g("e-concepto").trim();
    if(!concepto){say("Escribe qué se vendió.",true);return}
    if(r&&!(cant>0)){say("Escribe cuántos frascos se vendieron.",true);return}
    const sal=$("e-saldado").checked,cobr=$("e-cobrado").checked;
    const patch={fecha:g("e-date"),receta_id:rid,concepto,cantidad:r?cant:null,precio:r?(g("e-precio")===""?null:n("e-precio")):null,total,cliente:t("e-cli"),cobro:g("e-pago"),forma:t("e-forma"),cobrado:cobr,cobrado_fecha:cobr?(g("e-cfecha")||hoyS()):null,nota:t("e-note"),saldado:sal,saldado_fecha:sal?(g("e-sfecha")||hoyS()):null,saldado_forma:sal?t("e-sforma"):null,saldado_obs:sal?t("e-sobs"):null};
    fn=()=>editVenta(old,patch);
  }else if(k==="sm_ing"){
    const old=ingBy(id),precio=n("e-precio")||0,nombre=g("e-name").trim();if(!old||!nombre)return;
    const patch={nombre,unidad:g("e-uni"),precio,existencia:n("e-exist")||0,minimo:n("e-min")||0,proveedor:t("e-prov")};
    fn=async()=>{await chk(sb.from("sm_ingredientes").update(patch).eq("id",id));
      if(Math.abs(precio-old.precio)>1e-9)await chk(sb.from("sm_precios").insert({ingrediente_id:id,fecha:hoyS(),precio,proveedor:patch.proveedor,origen:"manual"}))};
  }else if(k==="sm_rec"){
    const nombre=g("e-name").trim(),rend=n("e-rend");if(!nombre||!(rend>0))return;
    const patch={nombre,rendimiento:rend,frasco:t("e-frasco"),precio_venta:n("e-pv")||0,existencia:n("e-exist")||0,notas:t("e-note")};
    fn=()=>chk(sb.from("sm_recetas").update(patch).eq("id",id));
  }else if(k==="sm_item"){
    const cant=n("e-cant");if(!(cant>0))return;
    const patch={ingrediente_id:g("e-ing"),cantidad:cant,unidad:g("e-uni")};
    fn=()=>chk(sb.from("sm_receta_items").update(patch).eq("id",id));
  }else{
    const patch={fecha:g("e-date"),nota:t("e-note")};
    fn=()=>chk(sb.from("sm_producciones").update(patch).eq("id",id));
  }
  seq(fn).then(ok=>{if(ok){edit=null;armed=false;render();say("Cambios guardados.")}});
}

function smSubmit(f){
  const g=x=>$(x)?$(x).value:"",n=x=>parseFloat(g(x)),t=x=>g(x).trim()||null;
  if(f==="sg"){
    const monto=n("g-amt"),concepto=g("g-concepto").trim();if(!(monto>0)||!concepto)return true;
    seq(()=>chk(sb.from("sm_gastos").insert({fecha:g("g-date"),concepto,categoria:g("g-cat"),monto,pago:g("g-pago"),forma:t("g-forma"),nota:t("g-note")}))).then(ok=>{if(ok)say("Gasto agregado.")});
    return true;
  }
  if(f==="sc"){
    const ingId=g("c-ing")||null,ing=ingId?ingBy(ingId):null,total=n("c-total"),cant=n("c-cant");
    if(!(total>0))return true;
    if(ing&&!(cant>0)){say("Escribe la cantidad comprada.",true);return true}
    const concepto=ing?ing.nombre:g("c-concepto").trim();
    if(!concepto){say("Escribe qué compraste.",true);return true}
    const c={fecha:g("c-date"),ingrediente_id:ingId,concepto,cantidad:ing?cant:null,unidad:ing?g("c-uni"):null,total,proveedor:t("c-prov"),pago:g("c-pago"),forma:t("c-forma"),nota:t("c-note")};
    seq(()=>addCompra(c)).then(ok=>{if(ok)say("Compra registrada."+(ing?" Inventario y precio actualizados.":""))});
    return true;
  }
  if(f==="sv"){
    const rid=g("v-prod")||null,r=rid?recBy(rid):null,total=n("v-total"),cant=n("v-cant");
    if(!(total>0)){say("Escribe el total cobrado.",true);return true}
    if(r&&!(cant>0)){say("Escribe cuántos frascos se vendieron.",true);return true}
    const concepto=r?r.nombre:g("v-concepto").trim();
    if(!concepto){say("Escribe qué se vendió.",true);return true}
    const cobrado=g("v-est")==="cobrado";
    const v={fecha:g("v-date"),receta_id:rid,concepto,cantidad:r?cant:null,precio:r?(n("v-precio")||null):null,total,cliente:t("v-cli"),cobro:g("v-cobro"),forma:t("v-forma"),cobrado,cobrado_fecha:cobrado?g("v-date"):null,nota:t("v-note")};
    seq(()=>addVenta(v)).then(ok=>{if(ok)say("Venta registrada."+(r?" Frascos descontados del inventario.":""))});
    return true;
  }
  if(f==="spv"){
    const pv=n("pv-precio");if(isNaN(pv)||pv<0||!rdet)return true;
    seq(()=>chk(sb.from("sm_recetas").update({precio_venta:pv}).eq("id",rdet))).then(ok=>{if(ok)say("Precio actualizado a "+fmt(pv)+".")});
    return true;
  }
  if(f==="si"){
    const nombre=g("i-name").trim();if(!nombre)return true;
    const precio=n("i-precio")||0,o={nombre,unidad:g("i-uni"),precio,existencia:n("i-exist")||0,minimo:n("i-min")||0,proveedor:t("i-prov")};
    seq(async()=>{const {data,error}=await sb.from("sm_ingredientes").insert(o).select("id").single();if(error)throw error;
      if(precio>0)await chk(sb.from("sm_precios").insert({ingrediente_id:data.id,fecha:hoyS(),precio,proveedor:o.proveedor,origen:"manual"}))}).then(ok=>{if(ok)say("Materia prima agregada.")});
    return true;
  }
  if(f==="sr"){
    const nombre=g("r-name").trim(),rend=n("r-rend");if(!nombre||!(rend>0))return true;
    seq(async()=>{const {data,error}=await sb.from("sm_recetas").insert({nombre,rendimiento:rend,frasco:t("r-frasco"),precio_venta:n("r-pv")||0}).select("id").single();if(error)throw error;rdet=data.id}).then(ok=>{if(ok)say("Receta creada. Agrega sus ingredientes.")});
    return true;
  }
  if(f==="sri"){
    const cant=n("ri-cant");if(!(cant>0)||!rdet)return true;
    seq(()=>chk(sb.from("sm_receta_items").insert({receta_id:rdet,ingrediente_id:g("ri-ing"),cantidad:cant,unidad:g("ri-uni")}))).then(ok=>{if(ok)say("Ingrediente agregado.")});
    return true;
  }
  if(f==="sp"){
    const r=recBy(rdet),lotes=n("p-lotes"),frascos=n("p-frascos");if(!r||!(lotes>0)||!(frascos>=0))return true;
    seq(()=>addProd(r,lotes,frascos,g("p-date"),t("p-note"))).then(ok=>{if(ok)say("Producción registrada. Inventario actualizado.")});
    return true;
  }
  if(f==="spr"){
    const i=ingBy(g("pr-ing")),precio=n("pr-precio");if(!i||isNaN(precio))return true;
    seq(async()=>{await chk(sb.from("sm_ingredientes").update({precio,proveedor:t("pr-prov")||i.proveedor}).eq("id",i.id));
      await chk(sb.from("sm_precios").insert({ingrediente_id:i.id,fecha:hoyS(),precio,proveedor:t("pr-prov"),origen:"manual"}))}).then(ok=>{if(ok)say("Precio actualizado.")});
    return true;
  }
  return false;
}
function smChange(t){
  if(t.id==="v-prod"){const r=recBy(t.value);$("v-conl").hidden=!!r;$("v-cantl").hidden=!r;$("v-precl").hidden=!r;
    if(r){$("v-precio").value=r.precio_venta||"";const c=parseFloat($("v-cant").value)||1;$("v-total").value=r.precio_venta?Math.round(c*r.precio_venta*100)/100:""}}
  if(t.id==="v-cant"||t.id==="v-precio"){const c=parseFloat($("v-cant").value),p=parseFloat($("v-precio").value);if(c>0&&p>=0)$("v-total").value=Math.round(c*p*100)/100}
  if(t.id==="c-ing"){
    const ing=ingBy(t.value),sel=$("c-uni");
    sel.innerHTML=ing?unidadesDe(ing.unidad).map(u=>`<option${u===ing.unidad?" selected":""}>${u}</option>`).join(""):"";
    $("c-conl").hidden=!!ing;$("c-cantl").hidden=!ing;$("c-unil").hidden=!ing;
    $("c-prov").value=ing&&ing.proveedor?ing.proveedor:"";
  }
  if(t.id==="ri-ing"){const ing=ingBy(t.value);$("ri-uni").innerHTML=ing?unidadesDe(ing.unidad).map(u=>`<option${u===ing.unidad?" selected":""}>${u}</option>`).join(""):""}
  if(t.id==="pr-ing"){const ing=ingBy(t.value);if(ing){$("pr-precio").value=ing.precio;$("pr-prov").value=ing.proveedor||""}}
  if(t.id==="p-lotes"){const r=recBy(rdet),l=parseFloat(t.value);if(r&&l>0)$("p-frascos").value=Math.round(l*r.rendimiento*1000)/1000}
}
document.addEventListener("input",e=>{const t=e.target;if(t.id==="v-cant"||t.id==="v-precio")smChange(t)});
function smClick(t,a){
  if(t.dataset&&t.dataset.modo){
    modo=t.dataset.modo;try{localStorage.setItem("modo",modo)}catch(e){}
    tab=modo==="sm"?"s_resumen":(owner()?"resumen":"compartidos");edit=null;rdet=null;armed=false;say("");
    drawTabs();render();window.scrollTo(0,0);return true;
  }
  if(t.dataset&&t.dataset.rec){tab="s_rec";rdet=t.dataset.rec;edit=null;say("");render();window.scrollTo(0,0);return true}
  if(t.dataset&&t.dataset.cobrar){seq(()=>chk(sb.from("sm_ventas").update({cobrado:true,cobrado_fecha:hoyS()}).eq("id",t.dataset.cobrar))).then(ok=>{if(ok)say("Venta cobrada.")});return true}
  if(a==="recback"){rdet=null;render();return true}
  if(a==="smsaldar"){
    if(!armed){sfecha=$("s-fecha")?$("s-fecha").value:"";sforma=$("s-forma")?$("s-forma").value:"Efectivo";sobs=$("s-obs")?$("s-obs").value.trim():"";armed=true;render();return true}
    const fs=sfecha||hoyS(),upd={saldado:true,saldado_fecha:fs,saldado_forma:sforma||null,saldado_obs:sobs||null};
    seq(async()=>{await chk(sb.from("sm_gastos").update(upd).eq("saldado",false));await chk(sb.from("sm_compras").update(upd).eq("saldado",false));await chk(sb.from("sm_ventas").update(upd).eq("saldado",false).eq("cobrado",true))})
      .then(ok=>{armed=false;sfecha="";sforma="Efectivo";sobs="";render();if(ok)say("Cuenta saldada el "+fd(fs)+".")});
    return true;
  }
  return false;
}

const TABS_S=[["s_resumen","Resumen"],["s_gastos","Gastos"],["s_compras","Compras"],["s_ventas","Ventas"],["s_inv","Inventario"],["s_rec","Recetas"],["s_precios","Precios"],["salir","Salir"]];
function rowOf(k,id){const S=D.sm;return({gastos:D.gastos,fijos:D.fijos,pagos:D.pagos,sm_gastos:S.gastos,sm_compras:S.compras,sm_ing:S.ing,sm_rec:S.rec,sm_item:S.items,sm_prod:S.prod,sm_ventas:S.ventas}[k]||[]).find(x=>x.id===id)}
const TABS_O=[["resumen","Resumen"],["gastos","Gastos"],["compartidos","Compartidos"],["fijos","Fijos"],["hipoteca","Hipoteca"],["acceso","Acceso"]];
const TABS_E=[["compartidos","Compartidos"],["hipoteca","Hipoteca"],["salir","Salir"]];
function drawTabs(){
  const T=modo==="sm"?TABS_S:(owner()?TABS_O:TABS_E);
  $("tabs").innerHTML=T.map(([k,l])=>`<button role="tab" data-tab="${k}">${l}</button>`).join("");
}
async function shell(){
  me=(await sb.auth.getUser()).data.user.id;
  $("app").innerHTML=`<div class="top"><h1 id="ttl">Mis Gastos</h1><div class="month" id="mnav"><button id="prev" aria-label="Mes anterior">‹</button><strong id="mlabel" style="min-width:120px;text-align:center"></strong><button id="next" aria-label="Mes siguiente">›</button></div></div>
  <div class="modes" id="modes"><button data-modo="fin">Finanzas</button><button data-modo="sm">Salsa Macha</button></div>
  <div class="tabs" id="tabs" role="tablist"></div><div id="note" class="msg" hidden></div><div id="view"></div>`;
  drawTabs();
  $("tabs").onclick=async e=>{const t=e.target.dataset.tab;if(!t)return;if(t==="salir"){await sb.auth.signOut();return boot()}
    if(t==="resumen"||t==="s_resumen"){cur=new Date();cur.setDate(1)}tab=t;edit=null;rdet=null;armed=false;say("");render()};
  $("prev").onclick=()=>{cur.setMonth(cur.getMonth()-1);render()};
  $("next").onclick=()=>{cur.setMonth(cur.getMonth()+1);render()};
  render();
}
function render(){
  if(!$("view"))return;
  $("mnav").hidden=!["gastos","s_gastos","s_compras","s_ventas"].includes(tab)||!!edit;
  $("ttl").textContent=modo==="sm"?"Salsa Macha":"Mis Gastos";
  document.querySelectorAll("#modes button").forEach(b=>b.setAttribute("aria-selected",b.dataset.modo===modo));
  $("mlabel").textContent=cur.toLocaleDateString("es-MX",{month:"long",year:"numeric"});
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  const V={resumen:vResumen,gastos:vGastos,compartidos:vCompartidos,fijos:vFijos,hipoteca:vHipoteca,acceso:vAcceso,s_resumen:vSResumen,s_gastos:vSGastos,s_compras:vSCompras,s_ventas:vSVentas,s_inv:vSInv,s_rec:vSRec,s_precios:vSPrecios};
  const v=edit?vEdit:(tab==="s_rec"&&rdet?vRecDet:V[tab]);
  $("view").innerHTML=v?v():"";
  if(tab==="acceso"&&!edit&&$("out"))$("out").onclick=async()=>{await sb.auth.signOut();boot()};
}

/* ---------- eventos ---------- */
document.addEventListener("change",e=>{
  const t=e.target;
  smChange(t);
  if(t.id==="g-tipo")$("g-pctl").hidden=t.value!=="compartido";
  if(t.id==="e-tipo"&&$("e-pctl"))$("e-pctl").hidden=t.value!=="compartido";
  if(t.id==="g-tarj")document.querySelectorAll(".efe").forEach(l=>l.hidden=t.value!=="Efectivo");
  if(t.id==="g-filtro"){fTarj=t.value;render()}
  if(t.dataset&&t.dataset.act==="cot"){
    const id=t.dataset.id;
    if(id.startsWith("fx-")){const g=mesG().find(x=>x.id===id);if(!g)return;
      run(sb.from("fin_gastos").insert({monto:g.monto,tarjeta:g.tarjeta,tipo:g.tipo,pct:g.pct,nota:g.nota,fijo_id:g.fijoId,fecha:g.fecha,cotejado:true}))}
    else run(sb.from("fin_gastos").update({cotejado:t.checked}).eq("id",id));
  }
});
const TABLA={gastos:"fin_gastos",fijos:"fin_fijos",pagos:"fin_hipoteca_pagos",sm_gastos:"sm_gastos",sm_ing:"sm_ingredientes",sm_rec:"sm_recetas",sm_item:"sm_receta_items"};
document.addEventListener("click",e=>{
  const t=e.target.closest("button")||e.target,a=t.dataset&&t.dataset.act;
  if(t.tagName==="BUTTON"&&document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  if(smClick(t,a))return;
  if(t.dataset&&t.dataset.go){tab=t.dataset.go;edit=null;say("");render();return}
  if(t.dataset&&t.dataset.pay){edit={k:"pagos",id:t.dataset.pay,preset:true};armed=false;say("");render();window.scrollTo(0,0);return}
  if(t.dataset&&t.dataset.saldar){edit={k:"gastos",id:t.dataset.saldar,preset:"saldar"};armed=false;say("");render();window.scrollTo(0,0);return}
  if(t.dataset&&t.dataset.edit){edit={k:t.dataset.edit,id:t.dataset.id};armed=false;say("");render();window.scrollTo(0,0);return}
  if(a==="canc"){edit=null;armed=false;render();return}
  if(a==="canc2"){armed=false;render();return}
  if(a==="saldarcuenta"){
    if(!armed){sfecha=$("s-fecha")?$("s-fecha").value:"";sforma=$("s-forma")?$("s-forma").value:"Efectivo";sobs=$("s-obs")?$("s-obs").value.trim():"";armed=true;render();return}
    const fs=sfecha||ymd(new Date());
    run(sb.from("fin_gastos").update({saldada:true,...(FECHA_OK?{saldada_fecha:fs}:{}),...(FORMA_OK?{saldada_forma:sforma||null,saldada_obs:sobs||null}:{})}).eq("tipo","compartido").eq("saldada",false)).then(ok=>{armed=false;sfecha="";sforma="Efectivo";sobs="";render();if(ok)say("Cuenta saldada el "+fd(fs)+".")});return}
  if(a==="del"){
    if(!armed){armed=true;render();return}
    if(edit.k.startsWith("sm_")){seq(()=>smDelete(edit.k,edit.id)).then(ok=>{if(ok){edit=null;armed=false;render()}});return}
    run(sb.from(TABLA[edit.k]).delete().eq("id",edit.id)).then(ok=>{if(ok){edit=null;armed=false;render()}});return}
  if(a==="deli")run(sb.from("fin_invitados").delete().eq("email",t.dataset.id));
});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target.id;
  if(smSubmit(f))return;
  if(f==="fg"){
    const o=owner(),tarjeta=$("g-tarj").value,tipo=o?$("g-tipo").value:"compartido";
    const g={monto:parseFloat($("g-amt").value),tarjeta,fecha:$("g-date").value,tipo,nota:$("g-note").value.trim()||null};
    if(!(g.monto>0))return;
    if(tipo==="compartido")g.pct=clampPct($("g-pct").value);
    if(tarjeta==="Efectivo"){g.quien=$("g-quien").value;g.deuda=$("g-deuda").value.trim()||null;g.cotejado=false}
    run(sb.from("fin_gastos").insert(g)).then(ok=>{if(ok&&$("g-amt")){$("g-amt").value="";$("g-note").value="";$("g-amt").focus()}});
  }
  if(f==="fc"){
    const g={monto:parseFloat($("c-amt").value),tarjeta:$("c-tarj").value,fecha:$("c-date").value,tipo:"compartido",pct:clampPct($("c-pct").value),nota:$("c-note").value.trim()||null,quien:$("c-quien").value};
    if(!(g.monto>0))return;
    run(sb.from("fin_gastos").insert(g)).then(ok=>{if(ok){say("Gasto compartido agregado.");if($("c-amt")){$("c-amt").value="";$("c-note").value=""}}});
  }
  if(f==="ff"){
    const o={nombre:$("f-name").value.trim(),monto:parseFloat($("f-amt").value),tarjeta:$("f-tarj").value,dia:Math.min(31,Math.max(1,parseInt($("f-dia").value)||1)),tipo:$("f-tipo").value};
    if(!o.nombre||!(o.monto>0))return;
    run(sb.from("fin_fijos").insert(o));
  }
  if(f==="fh")run(sb.from("fin_hipoteca_config").upsert({id:1,saldo:parseFloat($("h-saldo").value)||0,nota:$("h-nota").value.trim()||null})).then(ok=>{if(ok)say("Datos de la hipoteca guardados.")});
  if(f==="frp"){
    const mes=$("r-mes").value,fecha=$("r-fecha").value,monto=parseFloat($("r-monto").value);
    if(!mes||!fecha||!(monto>0))return;
    run(sb.from("fin_hipoteca_pagos").insert({mes,fecha,monto,registrado_por:$("r-est").value==="pagado"?"owner":"pendiente"})).then(ok=>{if(ok)say("Pago guardado.")});
  }
  if(f==="fe"){
    const {k,id}=edit;let patch;
    if(k.startsWith("sm_")){smEditSubmit(k,id);return}
    const monto=parseFloat($("e-amt").value);if(!(monto>0))return;
    if(k==="gastos"){
      const tipo=owner()?$("e-tipo").value:"compartido";
      patch={monto,tarjeta:$("e-tarj").value,fecha:$("e-date").value,tipo,pct:tipo==="compartido"?clampPct($("e-pct").value):null,nota:$("e-note").value.trim()||null};
      patch.quien=$("e-quien").value;
      if(owner()){patch.deuda=$("e-deuda").value.trim()||null;patch.saldada=$("e-saldada").checked;if(FECHA_OK)patch.saldada_fecha=patch.saldada?($("e-sfecha").value||ymd(new Date())):null;if(FORMA_OK){patch.saldada_forma=patch.saldada?($("e-sforma").value||null):null;patch.saldada_obs=patch.saldada?($("e-sobs").value.trim()||null):null}}
    }else if(k==="fijos"){
      patch={nombre:$("e-name").value.trim(),monto,tarjeta:$("e-tarj").value,dia:Math.min(31,Math.max(1,parseInt($("e-dia").value)||1)),tipo:$("e-tipo").value};
      if(!patch.nombre)return;
    }else{
      const row=D.pagos.find(x=>x.id===id);
      patch={mes:$("e-mes").value,fecha:$("e-date").value,monto,registrado_por:$("e-est").value==="pagado"?(row&&row.registrado_por==="esposa"?"esposa":"owner"):"pendiente"};
    }
    run(sb.from(TABLA[k]).update(patch).eq("id",id)).then(ok=>{if(ok){edit=null;armed=false;render();say("Cambios guardados.")}});
  }
  if(f==="fi")run(sb.from("fin_invitados").insert({email:$("i-mail").value.trim().toLowerCase()}));
  if(f==="fr"){
    const a=$("r-p1").value,b=$("r-p2").value;
    if(a!==b)return say("Las contraseñas no coinciden.",true);
    sb.auth.updateUser({password:a}).then(({error})=>{
      if(error)return say(error.message==="Auth session missing!"?"El enlace venció. Vuelve a pedir uno con \"Olvidé mi contraseña\".":error.message,true);
      recDone=true;history.replaceState(null,"",location.pathname);boot()});
  }
  if(f==="fp")sb.auth.updateUser({password:$("p-p1").value}).then(({error})=>{if(error)return say(error.message,true);$("p-p1").value="";say("Contraseña cambiada.")});
});
sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT")boot()});
document.addEventListener("visibilitychange",()=>{
  if(document.hidden||!rol||edit)return;
  const a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)&&a.type!=="checkbox")return;
  cargar().then(render)});
boot();
</script>
